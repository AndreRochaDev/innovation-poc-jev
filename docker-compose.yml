services:
  api:
    build: ./backend/JevClassifier.Api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - Jev__Model=${JEV_MODEL:-jev-1.13-free}
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "5173:80"
    depends_on:
      - api
